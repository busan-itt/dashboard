[theme]
base = "light"
showSidebarBorder = false
primaryColor = "#FF6F61"
backgroundColor = "#F8F9FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0A0F1F"
linkColor = "#1D3557"
borderColor = "#E2E5EA"
