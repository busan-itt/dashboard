<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 270" role="img"><title>환적 경로 비교에서 시뮬레이션 결과 비교까지의 분석 흐름</title><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><g transform="translate(8,12)"><text x="0" y="18" font-size="14" fill="#647783">01</text><g transform="translate(0,38)" fill="none" stroke="#3F617C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="26" height="20" rx="2"/><rect x="54" y="8" width="26" height="20" rx="2"/><path d="M30 18h24m-6-5 6 5-6 5M17 28v16h50V28"/></g><text x="0" y="135" font-size="21" font-weight="700" fill="#192C3A">환적 경로 비교</text><text x="0" y="171" font-size="18" fill="#465761">자부두·타부두 환적의</text><text x="0" y="199" font-size="18" fill="#465761">전체 소요시간 비교</text></g><path d="M254 77h25m-6-5 6 5-6 5" fill="none" stroke="#9AABB5" stroke-width="2"/><g transform="translate(302,12)"><text x="0" y="18" font-size="14" fill="#647783">02</text><g transform="translate(0,38)" fill="none" stroke="#3F617C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="29" width="28" height="18" rx="1"/><rect x="38" y="29" width="28" height="18" rx="1"/><rect x="22" y="7" width="28" height="18" rx="1"/><path d="M15 34v8m10-8v8m22-8v8m10-8v8M31 12v8m10-8v8"/></g><text x="0" y="135" font-size="21" font-weight="700" fill="#192C3A">야드 체류 분석</text><text x="0" y="171" font-size="18" fill="#465761">공정별 시간을 나누어</text><text x="0" y="199" font-size="18" fill="#465761">야드 체류와 관련 지표 분석</text></g><path d="M548 77h25m-6-5 6 5-6 5" fill="none" stroke="#9AABB5" stroke-width="2"/><g transform="translate(596,12)"><text x="0" y="18" font-size="14" fill="#647783">03</text><g transform="translate(0,38)" fill="none" stroke="#B77762" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="68" height="40" rx="3"/><path d="M5 21h68M20 3v12M57 3v12M16 32h20m-6-5 6 5-6 5M62 40H42m6-5-6 5 6 5"/></g><text x="0" y="135"